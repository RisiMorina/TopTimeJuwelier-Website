      - heading "Een familiezaak met honderd jaar geschiedenis." [level=2] [ref=f8e59]
      - paragraph [ref=f8e60]: Sinds 1926 is Top Time het adres in Deventer voor horloges en sieraden. Wat begon als een klein horlogeatelier aan de Spijkerboorsteeg, is uitgegroeid tot een juwelier waar drie generaties Deventenaren hun horloge lieten repareren en hun sieraden kochten.
      - paragraph [ref=f8e61]: "We combineren die ervaring met een scherp oog voor kwaliteit: elk sieraad in onze vitrines is gekeurd en gestempeld goud, en we werken inmiddels ook met lab-grown diamant — mooi, verantwoord en betaalbaar."
